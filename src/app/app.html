<app-head-bar></app-head-bar>

<app-search-bar
  [autos]="autoList"
  (selectAutoEvent)="updateAuto($event)"
></app-search-bar>

@if (selectedAuto) {
  <div class="auto-details">
    <img [src]="'images/' + selectedAuto.photo" alt="{{ selectedAuto.model }}" />
    <div class="auto-details-text">
      <h2>{{ selectedAuto.brand }} {{ selectedAuto.model }}</h2>
      <p class="price">{{ selectedAuto.price }} DNT</p>
      <p class="description">{{ selectedAuto.description }}</p>
      <ul>
        <li>Power : {{ selectedAuto.power }}</li>
        <li>Availability : {{ selectedAuto.availability }} units</li>
      </ul>
    </div>
  </div>
}
